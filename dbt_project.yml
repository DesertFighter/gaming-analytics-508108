# ============================================================
# Mobile Gaming Analytics - dbt Project
# ============================================================

name: 'gaming_analytics'
version: '1.0.0'
config-version: 2

profile: 'default'


# ============================================================
# Project paths
# ============================================================

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"


# ============================================================
# Medallion Architecture
# ============================================================

models:

  gaming_analytics:

    # --------------------------------------------------------
    # BRONZE
    # Historical / lightly standardized source data
    # --------------------------------------------------------
    bronze:
      +materialized: incremental
      +schema: bronze


    # --------------------------------------------------------
    # SILVER
    # Cleansed, validated, deduplicated and conformed data
    # Includes dimensions and detailed fact tables
    # --------------------------------------------------------
    silver:
      +materialized: incremental
      +schema: silver


    # --------------------------------------------------------
    # GOLD
    # Final analytical / OBT / aggregated business outputs
    # --------------------------------------------------------
    gold:
      +materialized: materialized_view
      +schema: gold