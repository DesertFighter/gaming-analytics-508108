# TESTING CONVENTIONS FOR THE SILVER LAYER
# not_null        -> fails when the tested column contains NULL.
# unique          -> fails when the tested column contains duplicate values.
# relationships   -> validates referential integrity: populated foreign keys must exist in the referenced Silver parent model.
# accepted_values -> validates that a column contains only an approved domain of values.
# non_negative    -> custom generic test; fails when the tested numeric column contains a value below 0.
#
# DBT DATA-TEST BEHAVIOUR:
# A dbt data test is written/compiled to return the rows that violate the rule.
# 0 failing rows returned  -> PASS.
# 1+ failing rows returned -> FAIL (or WARN if severity is configured as warn).
#
# CUSTOM GENERIC TEST USED HERE:
# non_negative is defined once in tests/generic/test_non_negative.sql and reused on multiple columns.
# It receives the current model and column_name as parameters and returns rows where column_name < 0.
#
# Tests are placed only where the business rule is known.
# We do not invent accepted-value domains for status/type columns.
